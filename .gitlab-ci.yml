image: node:24.13.1-alpine

stages:
  - deploy
  - mirror

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

variables:
  NODE_OPTIONS: '--max_old_space_size=4096'

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    # For project Pages at https://nekorg.gitlab.io/feline/ you need base /feline/
    # For a custom domain (root) use base /:
    - npm run build -- --base=/feline/
    # - npm run build -- --base=/
    # GitLab Pages serves from `public/` - Vite builds to `dist/`
    - rm -rf public
    - mv dist public
    # SPA fallback: GitLab Pages has no _redirects support like Netlify (netlify.toml:33).
    # Copying index.html to 404.html makes client-side routing work (404.html is served for unknown paths).
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Mirror to GitHub on every push (server-side, works even when pushing via GitLab UI/API)
# Required CI variable: GITHUB_SSH_PRIVATE_KEY = SSH private key with write access to git@github.com:nekorg-gitlab/Feline.git
# Generate with: ssh-keygen -t ed25519 -C "gitlab-ci-mirror" -f /tmp/mirror && cat /tmp/mirror.pub -> add as Deploy Key (write) on GitHub
mirror_to_github:
  stage: mirror
  image: alpine:latest
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache git openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan github.com >> ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
    - |
      if [ -z "$GITHUB_SSH_PRIVATE_KEY" ]; then
        echo "GITHUB_SSH_PRIVATE_KEY not set - skipping mirror (add it in GitLab > Settings > CI/CD > Variables)"
        exit 0
      fi
    - |
      # Support: raw PEM, single-line PEM (Windows clipboard), base64, or File-type variable
      if [ -f "$GITHUB_SSH_PRIVATE_KEY" ]; then
        cp "$GITHUB_SSH_PRIVATE_KEY" /tmp/key_input
      else
        printf '%s\n' "$GITHUB_SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/key_input
      fi
      # ensure trailing newline (ssh-keygen requires it)
      tail -c1 /tmp/key_input | od -An -tx1 | grep -q "0a" || echo "" >> /tmp/key_input
      # if base64 single line (no PEM header), decode
      if ! grep -q "BEGIN OPENSSH" /tmp/key_input 2>/dev/null; then
        if base64 -d /tmp/key_input > ~/.ssh/id_ed25519 2>/dev/null && ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
          echo "decoded base64 key"
        else
          cp /tmp/key_input ~/.ssh/id_ed25519
        fi
      else
        # PEM present but maybe single-line (clipboard collapsed newlines to spaces)
        if [ "$(wc -l < /tmp/key_input)" -eq 1 ]; then
          # reformat: headers on own lines, body 70-char wrapped
          awk '{
            gsub(/-----BEGIN OPENSSH PRIVATE KEY-----/, "-----BEGIN OPENSSH PRIVATE KEY-----\n");
            gsub(/-----END OPENSSH PRIVATE KEY-----/, "\n-----END OPENSSH PRIVATE KEY-----");
            gsub(/ /, "\n");
            print
          }' /tmp/key_input | awk 'NR==1 || NR==NF {print; next} {for(i=1;i<=length;i+=70) print substr($0,i,70)}' > ~/.ssh/id_ed25519
        else
          cp /tmp/key_input ~/.ssh/id_ed25519
        fi
      fi
      # ensure trailing newline on output key too
      tail -c1 ~/.ssh/id_ed25519 | od -An -tx1 | grep -q "0a" || echo "" >> ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      echo "key lines: $(wc -l < ~/.ssh/id_ed25519) first: $(head -1 ~/.ssh/id_ed25519) last: $(tail -1 ~/.ssh/id_ed25519)"
      ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null || (echo "ERROR: GITHUB_SSH_PRIVATE_KEY invalid - must be private key (-----BEGIN...), use: [Convert]::ToBase64String([IO.File]::ReadAllBytes(\"C:\\tmp\\mirror\")) for base64 or Get-Content -Raw for File type"; cat -A /tmp/key_input | head -c 200; echo; exit 1)
    - git config --global user.email "ci@nekorg.gitlab.io"
    - git config --global user.name "GitLab CI"
  script:
    - git remote remove github 2>/dev/null || true
    - git remote add github git@github.com:nekorg-gitlab/Feline.git
    - GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519" git push github --all --force
    - GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519" git push github --tags --force
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  allow_failure: true

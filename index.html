    <script>
      (function () {
        var s = [
          'Adding default global',
          'Ignoring expired device membership',
          'GroupCallEventHandler',
          'Resuming queue after resumed sync',
          'Rotating session for room',
          'Activated a backup',
          'Failed to decrypt a room event',
          'matrix_sdk',
          'DecryptionError',
          'Images loaded lazily',
          'MaxListenersExceededWarning',
          'Possible EventEmitter memory leak',
          'ObjectMultiplex',
          'background-liveness',
          'contentscript.js',
          'React Router Future Flag Warning',
          'v7_startTransition',
          'has been externalized for browser compatibility',
          'Permissions-Policy',
          'attribution-reporting',
          'browsing-topics',
          'CallMembership',
          'MatrixRTCSession',
          'getVersion',
          'm.room.create',
          'One time key',
          'already exists',
          'Failed to process outgoing',
          'room_keys',
          'rtc/transports',
          'M_UNKNOWN',
          'MatrixError',
        ];
        function e(t) {
          try {
            var x = t
              .map(function (a) {
                return typeof a === 'string' ? a : String(a);
              })
              .join(' ')
              .toLowerCase();
            return s.some(function (p) {
              return x.indexOf(p.toLowerCase()) !== -1;
            });
          } catch (_) {
            return false;
          }
        }
        ['log', 'info', 'warn', 'error', 'debug', 'trace'].forEach(function (k) {
          var o = console[k];
          if (typeof o !== 'function') return;
          console[k] = function () {
            if (e([].slice.call(arguments))) return;
            return o.apply(console, arguments);
          };
        });
        window.addEventListener('error', function (ev) {
          if (e([ev.message, ev.filename])) ev.preventDefault();
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var r = ev.reason;
          var t = typeof r === 'string' ? r : (r && r.message) || String(r);
          if (e([t])) ev.preventDefault();
        });
      })();
    </script>
